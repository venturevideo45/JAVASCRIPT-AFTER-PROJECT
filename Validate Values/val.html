<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age-Gated Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #f4f4f9; }
        .login-card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #message { margin-top: 15px; font-size: 0.9rem; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Login</h2>

    <form id="loginForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="age">Age</label>
        <input type="number" id="age" placeholder="Min. 18" required>

        <button type="submit">Access Portal</button>
    </form>
    <div id="message"></div>
</div>

<script>

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); 

        const nameInput = document.getElementById('name').value.trim();
        const ageInput = parseInt(document.getElementById('age').value);
        const msg = document.getElementById('message');

        // Validation Logic
        if (nameInput.length < 2) {
            msg.textContent = "Please enter a valid name.";
            msg.style.color = "orange";
        } else if (ageInput < 18) {
            msg.textContent = "Access Denied: You must be 18 or older.";
            msg.style.color = "red";
        } else {
            msg.textContent = "Welcome, " + nameInput + "! Access Granted.";
            msg.style.color = "green";

        }
    });
</script>

</body>
</html>
