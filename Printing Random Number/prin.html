<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printing Random Numbers in JS</title>
</head>

<body>
    <h1>How To Print Random Numbers in JavaScript</h1>
    <div id="output"></div>
    <button id="restartBtn">Restart Website</button>
    <script>
        function getRandomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
document.getElementById("output").innerHTML = getRandomInt(1, 10);

        document.getElementById("restartBtn").onclick = function() {
            location.reload();
        };
    </script>
</body>
