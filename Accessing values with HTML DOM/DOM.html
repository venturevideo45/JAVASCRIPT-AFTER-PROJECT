<!DOCTYPE html>
<html>
    <head>
        <title>DOM Manipulation</title>
        <style>
            .bruh {
                background-image: linear-gradient(to right, orange, red);
                border: none;
                padding: 15px 32px;
                text-align: center;
                font-size: 20px;
                margin: 4px 2px;
                cursor: wait;
                border: 3px solid black;
                text-decoration: underline;

            }
        </style>
    </head>
    <body>
        <h2>Accessing and Modifying Values with HTML DOM</h2>
        <p>JavaScript can access HTML elements and modify their content or attributes.</p>
        <h2 id="demo">This is a demonstration paragraph.</h2>
        <H1>PRESS THIS BUTTON FIRST ↓ ↓ ↓ </H1>
        <button type="button" onclick="changeContent() " id="per">Click Me to Change Content</button><br>
        <h1>THEN PRESS THIS ↓ ↓ ↓</h1>
        <button type="button" onclick="changeStyle()" class="bruh">Click Me to Change Style</button>
        <script>
            function changeContent() {
                document.getElementById("demo").innerHTML = "The content has been changed!";
            }
            function changeStyle() {
                document.getElementById("demo").style.color = "blue";
                document.getElementById("demo").style.fontFamily = "Arial";
                document.getElementById("demo").style.fontSize = "34px";
                document.getElementById("demo").style.backgroundImage = "linear-gradient(to right, orange, red)";
                document.getElementById("demo").style.border = "3px solid black";
                document.getElementById("demo").style.textDecoration = "underline black";
                document.getElementById("per").classList.add("bruh");


            }
        </script>
