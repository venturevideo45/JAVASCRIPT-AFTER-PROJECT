<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes in JavaScript - Example 7</title>
</head>
<body>
    <h1>Classes in JavaScript Example </h1>
    <p> <b><u>Check in Console</u></b></p>
    <script>
        class Calculator {
  static add(a, b) {
    return a + b;
  }


  multiply(a, b) {
    return a * b;
  }
}

console.log(Calculator.add(5, 10));
const myCalc = new Calculator();
console.log(myCalc.multiply(5, 10));

    </script>
</body>
